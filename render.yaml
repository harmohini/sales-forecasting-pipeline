# Render Blueprint Specification for Sales Forecasting Pipeline
# Render deployment configuration for Web Service and PostgreSQL Database

services:
  - type: web
    name: sales-forecasting-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: MODEL_PATH
        value: models/
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: sales-forecasting-db
          property: connectionString

databases:
  - name: sales-forecasting-db
    databaseName: sales_forecasting
    user: postgres
    plan: free
